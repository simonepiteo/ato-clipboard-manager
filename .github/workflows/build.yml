name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Swift release build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build release
        run: swift build -c release --disable-sandbox
